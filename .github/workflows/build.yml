name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer & Flet
        run: |
          pip install --upgrade pip
          pip install buildozer flet cython

      - name: Build APK with Buildozer
        run: |
          buildozer init
          # Ubah konfigurasi buildozer.spec secara otomatis
          sed -i 's/title = My Application/title = Kebiasaan Anak/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = kebiasaananak/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = com.dennis/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,flet/' buildozer.spec
          
          # Jalankan build dengan 'yes' otomatis untuk menyetujui lisensi
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kebiasaan-anak-apk
          path: bin/*.apk
          
